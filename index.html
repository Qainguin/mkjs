<head>

	<style>
		@font-face {
			font-family: "NDS";
			src: url("resource/NDS.ttf");
		}

		@keyframes blink {
			0% { opacity: 0.25; }
			50% { opacity: 1; }
			100% { opacity: 0.25; }
		}

		#romBlink {
			text-align: center;
			color: white;
			font-family: 'NDS';
			font-size: 64px;
			font-smooth: never;
			-webkit-font-smoothing: none;
			font-weight: normal;
			animation: blink 2s infinite;
		}
	</style>

<body style="margin:0; background-color:black; color: white;">
	<div style="display: grid; place-content: center; width: 100vw; height: 100vh; position: fixed; z-index: 100;">
		<h1 id="romBlink">You need to supply MKJS with a Mario Kart DS ROM to function. <br/> Click anywhere on the page to load a file.</h1>
	</div>

	<canvas height="720" width="1280" id="canvas3d" style="width:100%; height:100%;"></canvas>
	<input type="file" id="fileIn" style="display:none;">
